name: Validate Bancus Fraternis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Public safety and contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check validator syntax
        run: |
          for file in tools/*.mjs; do
            node --check "$file"
          done

      - name: Check simulator script syntax
        run: |
          node --check js/proposal-builder.js
          node --check js/proposal-summary.js
          node --check js/proposal-governance.js
          node --check js/simulator-journey.js
          node --check js/simulator-state.js
          node --check js/simulator-shelf.js
          node --check js/simulator-cart.js
          node --check js/backend/db.js
          node --check assets/js/calculadoras-page.js
          node --check js/app.js

      - name: Run static validators
        run: |
          node tools/validate-public-release-safety.mjs
          node tools/validate-local-database.mjs
          node tools/validate-public-contracts.mjs
          node tools/validate-docs-modernization.mjs
          node tools/validate-calculadoras.mjs
          node tools/validate-calculator-journey.mjs
          node tools/validate-simulator-groups.mjs
          node tools/validate-simulator-performance.mjs
          node tools/validate-simulator-refactor.mjs
          node tools/validate-simulator-shelf.mjs
          node tools/validate-simulator-cart.mjs
          node tools/validate-simulator-result-decision.mjs
          node tools/validate-proposal-builder.mjs
          node tools/validate-proposal-governance.mjs
          node tools/validate-proposal-versioning.mjs
          node tools/validate-proposal-secure-share.mjs
          node tools/validate-auth-navigation.mjs
          node tools/validate-auth-production.mjs
          node tools/validate-database-provider.mjs
          node tools/validate-navigable-journey.mjs
          node tools/validate-design-system.mjs
